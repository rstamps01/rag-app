    #  context: https://github.com/rstamps01/rag-app.git#main
=======
>>>>>>> e35a376a205bad2acb607db7a526f3357334cdea
      context: ./frontend
      dockerfile: Dockerfile
      args:
      - BUILDKIT_INLINE_CACHE=1
    container_name: frontend-07
    environment:
    - REACT_APP_API_URL=http://localhost:8000
    - REACT_APP_ENVIRONMENT=production
    - REACT_APP_API_URL_INTERNAL=http://backend-07:8000
    volumes:
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 3000:3000
    networks:
    - network-07
    depends_on:
    - backend-07
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
      

  db-init-07:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db-init-07
    environment:
    - DATABASE_URL=postgresql://rag:rag@postgres-07:5432/rag
    - QDRANT_URL=http://qdrant-07:6333
    - QDRANT_COLLECTION_NAME=rag
    - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    - PYTHONPATH=/app
    - LOG_LEVEL=INFO
    volumes:
    - ./backend:/app
    - db_init_status:/tmp
    networks:
    - network-07
    depends_on:
      postgres-07:
        condition: service_healthy
      qdrant-07:
        condition: service_healthy
    command: "sh -c \"\n  echo '\U0001F680 Starting integrated database initialization...'\
      \ &&\n  python /app/app/scripts/init_database.py &&\n  echo '\u2705 Database\
      \ schema initialization complete' &&\n  python /app/app/scripts/init_qdrant_collection.py\
      \ &&\n  echo '\u2705 Qdrant collection initialization complete' &&\n  python\
      \ /app/app/scripts/verify_integration.py &&\n  echo '\u2705 Integration verification\
      \ complete' &&\n  touch /tmp/.db_init_complete &&\n  echo '\U0001F389 Integrated\
      \ database initialization completed successfully' &&\n  exit 0\n\"\n"
    restart: 'no'

  cache-init-07:
    build:
      context: ./backend
      dockerfile: Dockerfile.cache-init
      args:
      - BUILDKIT_INLINE_CACHE=1
    container_name: cache-init-07
    environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HOME=/app/models_cache
    - MODELS_CACHE_DIR=/app/models_cache
    - HF_HUB_CACHE=/app/models_cache/hub
    - CUDA_VISIBLE_DEVICES=0
    - NVIDIA_VISIBLE_DEVICES=0
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
    - ./backend/models_cache:/app/models_cache
    - cache_init_logs:/app/logs
    networks:
    - network-07
    profiles:
    - cache-init
    restart: 'no'
    command: "sh -c \"\n  if [ -f /app/models_cache/.initialization_complete ]; then\n\
      \    echo 'Cache already initialized, skipping...'\n    exit 0\n  else\n   \
      \ echo 'Starting cache initialization...' &&\n    python /app/scripts/initialize_model_cache.py\
      \ &&\n    touch /app/models_cache/.initialization_complete &&\n    echo 'Cache\
      \ initialization completed successfully' &&\n    exit 0\n  fi\n\"\n"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.rag-app.service

volumes:
  postgres_data-07:
    driver: local
    name: postgres_data-07
  qdrant_data-07:
    driver: local
    name: qdrant_data-07
  backend_logs-07:
    driver: local
    name: backend_logs-07
  uploaded_documents-07:
    driver: local
    name: uploaded_documents-07
  cache_init_logs:
    driver: local
    name: cache_init_logs_07
  db_init_status:
    driver: local
    name: db_init_status_07

networks:
  network-07:
    driver: bridge
    name: network-07
