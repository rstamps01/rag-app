services:
  backend-07:
    env_file:
    - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-07
    restart: unless-stopped
    ports:
    - 8000:8000
    - 9090:9090
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 8G
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu

    volumes:
    - ./backend/models_cache:/app/models_cache:rw
    - backend_logs-07:/app/data/logs:rw
    - uploaded_documents-07:/app/data/uploads:rw
    environment:
    - HF_HOME=/app/models_cache
    - HF_HUB_CACHE=/app/models_cache/hub
    - MODELS_CACHE_DIR=/app/models_cache
    - PYTHONPATH=/app
    - TORCH_CUDA_ARCH_LIST=12.0
    - CUDA_VISIBLE_DEVICES=0
    - NVIDIA_VISIBLE_DEVICES=0
    - CUDA_LAUNCH_BLOCKING=1
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - DATABASE_URL=postgresql://rag:rag@postgres-07:5432/rag
    - QDRANT_URL=http://qdrant-07:6333
    - QDRANT_COLLECTION_NAME=rag
    - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    - LLM_MODEL_NAME=mistralai/Mistral-7B-Instruct-v0.2
    - UPLOAD_DIR=/app/data/uploads
    - JWT_SECRET=${JWT_SECRET}
    - JWT_ALGORITHM=HS256
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - ENVIRONMENT=development
    - LOG_LEVEL=DEBUG
    - DEBUG=true
    - POSTGRES_USER=rag
    - POSTGRES_PASSWORD=rag
    - POSTGRES_DB=rag
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,expandable_segments:True
    - TRITON_CACHE_DIR=/tmp/triton_cache
    - TRITON_KERNEL_CACHE_SIZE=1024
  # PyTorch Verbose Logging
    - TORCHDYNAMO_VERBOSE=1
    - TORCH_LOGS=+dynamo,+distributed,+inductor
    command: "sh -c \"\n  echo 'Waiting for cache initialization...' &&\n  while [\
      \ ! -f /app/models_cache/.initialization_complete ]; do\n    echo 'Cache not\
      \ ready, waiting...'\n    sleep 2\n  done &&\n  echo 'Cache initialization detected,\
      \ starting backend...' &&\n  sleep 7 &&\n  cd /app &&\n  echo 'Skipping migrations\
      \ - starting FastAPI application...' &&\n  PYTHONPATH=/app python -m uvicorn\
      \ app.main:app --host 0.0.0.0 --port 8000\n\"\n"
    networks:
    - network-07

  postgres-07:
    image: postgres:15
    container_name: postgres-07
    restart: unless-stopped
    environment:
    - POSTGRES_USER=rag
    - POSTGRES_PASSWORD=rag
    - POSTGRES_DB=rag
    volumes:
    - postgres_data-07:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U rag -d rag
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - network-07

  qdrant-07:
    image: qdrant/qdrant:latest
    container_name: qdrant-07
    restart: unless-stopped
    environment:
    - QDRANT_URL=http://qdrant-07:6333
    - QDRANT_HOST=qdrant-07
    - QDRANT_PORT=6333
    - QDRANT_COLLECTION_NAME=rag
    volumes:
    - qdrant_data-07:/qdrant/storage
    ports:
    - 6333:6333
    - 6334:6334
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - grep -q ':18BD ' /proc/net/tcp
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - network-07

  frontend-07:
    build:
