services:
  backend-07:
    env_file:
    - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-07
    restart: unless-stopped
    ports:
    - 8000:8000
    - 9090:9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 24G
          cpus: '16.0'
        reservations:
          memory: 8G
          cpus: '4.0'
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    volumes:
    - models_cache-07:/app/models_cache:rw
    - backend_logs-07:/app/data/logs:rw
    - uploaded_documents-07:/app/data/uploads:rw
    shm_size: '8gb'
    environment:
    - HF_HOME=/app/models_cache
    - HF_HUB_CACHE=/app/models_cache/hub
    - MODELS_CACHE_DIR=/app/models_cache
    - PYTHONPATH=/app
    - TORCH_CUDA_ARCH_LIST=12.0
    - CUDA_VISIBLE_DEVICES=0
    - NVIDIA_VISIBLE_DEVICES=0
    - CUDA_LAUNCH_BLOCKING=0
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - OMP_NUM_THREADS=8
    - MKL_NUM_THREADS=8
    - TORCH_NUM_THREADS=8
    - PYTHONOPTIMIZE=2
    - PYTHONDONTWRITEBYTECODE=1
    - CUDA_MODULE_LOADING=LAZY
    - DATABASE_URL=postgresql://rag:rag@postgres-07:5432/rag
    - QDRANT_URL=http://qdrant-07:6333
    - QDRANT_COLLECTION_NAME=rag
    - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    - LLM_MODEL_NAME=mistralai/Mistral-7B-Instruct-v0.2
    - UPLOAD_DIR=/app/data/uploads
    - SECRET_KEY=${SECRET_KEY}
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - ENVIRONMENT=development
    - LOG_LEVEL=DEBUG
    - DEBUG=true
    - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,expandable_segments:True
    - TRITON_CACHE_DIR=/tmp/triton_cache
    command: >
      sh -c "cd /app && PYTHONPATH=/app python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --workers 2"
    networks:
    - network-07
    depends_on:
      postgres-07:
        condition: service_healthy
      qdrant-07:
        condition: service_healthy

  postgres-07:
    image: postgres:15
    container_name: postgres-07
    restart: unless-stopped
    environment:
    - POSTGRES_USER=rag
    - POSTGRES_PASSWORD=rag
    - POSTGRES_DB=rag
    volumes:
    - postgres_data-07:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - network-07

  qdrant-07:
    image: qdrant/qdrant:gpu-nvidia-latest
    container_name: qdrant-07
    restart: unless-stopped
    environment:
    - QDRANT__GPU__INDEXING=1
    - QDRANT__GPU__ALLOW_EMULATED=true
    - QDRANT__GPU__GROUPS_COUNT=256
    - QDRANT__GPU__PARALLEL_INDEXES=1
    - QDRANT__LOG_LEVEL=info
    volumes:
    - qdrant_data-07:/qdrant/storage
    ports:
    - 6333:6333
    - 6334:6334
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    runtime: nvidia
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q ':18BD ' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - network-07

  frontend-07:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
      - BUILDKIT_INLINE_CACHE=1
    container_name: frontend-07
    environment:
    - REACT_APP_API_URL=http://localhost:8000
    - REACT_APP_ENVIRONMENT=production
    - REACT_APP_API_URL_INTERNAL=http://backend-07:8000
    ports:
    - 3000:3000
    networks:
    - network-07
    depends_on:
    - backend-07
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-init-07:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: db-init-07
    environment:
    - DATABASE_URL=postgresql://rag:rag@postgres-07:5432/rag
    - QDRANT_URL=http://qdrant-07:6333
    - QDRANT_COLLECTION_NAME=rag
    - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    - PYTHONPATH=/app
    - LOG_LEVEL=INFO
    networks:
    - network-07
    depends_on:
      postgres-07:
        condition: service_healthy
      qdrant-07:
        condition: service_healthy
    command: >
      sh -c "echo 'Starting database initialization...' &&
      python /app/app/scripts/init_database.py &&
      python /app/app/scripts/init_qdrant_collection.py &&
      python /app/app/scripts/verify_integration.py &&
      echo 'Database initialization completed successfully'"
    restart: 'no'

  cache-init-07:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cache-init-07
    environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    - HF_HOME=/app/models_cache
    - MODELS_CACHE_DIR=/app/models_cache
    - HF_HUB_CACHE=/app/models_cache/hub
    - CUDA_VISIBLE_DEVICES=0
    - NVIDIA_VISIBLE_DEVICES=0
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    volumes:
    - models_cache-07:/app/models_cache
    networks:
    - network-07
    profiles:
    - cache-init
    restart: 'no'
    command: >
      sh -c "if [ -f /app/models_cache/.initialization_complete ]; then
        echo 'Cache already initialized, skipping...'; exit 0;
      else
        echo 'Starting cache initialization...' &&
        python /app/scripts/initialize_model_cache.py &&
        touch /app/models_cache/.initialization_complete &&
        echo 'Cache initialization completed successfully';
      fi"
    deploy:
      resources:
        limits:
          memory: 24G
          cpus: '16.0'
        reservations:
          memory: 8G
          cpus: '4.0'
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_data-07:
    driver: local
    name: postgres_data-07
  qdrant_data-07:
    driver: local
    name: qdrant_data-07
  backend_logs-07:
    driver: local
    name: backend_logs-07
  uploaded_documents-07:
    driver: local
    name: uploaded_documents-07
  models_cache-07:
    driver: local
    name: models_cache-07

networks:
  network-07:
    driver: bridge
    name: network-07
